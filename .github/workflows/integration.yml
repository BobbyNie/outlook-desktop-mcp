# Optional manual integration tests — requires Classic Outlook on the runner.
# Not part of PR required checks (GitHub-hosted Windows runners lack Outlook).
name: Integration (Outlook)

on:
  workflow_dispatch:

jobs:
  integration:
    name: Integration (Windows / Outlook)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run Outlook integration tests
        env:
          RUN_OUTLOOK_INTEGRATION: "1"
        run: python -m pytest tests/contacts_mcp_test.py tests/drafts_mcp_test.py -q
